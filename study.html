    let currentRound = 1;

    function getRoundFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const r = parseInt(params.get('round'), 10);
      if (r >= 1 && r <= 7) return r;
      return 1;
    }

    function selectRound(roundNum) {
      currentRound = roundNum;
      
      // URL 파라미터 업데이트 (새로고침 없이)
      const url = new URL(window.location);
      url.searchParams.set('round', roundNum);
      window.history.replaceState({}, '', url);

      // 탭 스타일 갱신
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        if (idx + 1 === roundNum) {
          btn.classList.add('active');
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        } else {
          btn.classList.remove('active');
        }
      });

      const data = STUDY_DATA[roundNum];
      if (!data) return;

      // 헤더 영역 갱신
      document.getElementById('hero-tag').textContent = `ROUND 0${roundNum}`;
      document.getElementById('hero-title').textContent = data.title;
      document.getElementById('hero-desc').textContent = ROUND_DESCS[roundNum] || "핵심 암기 요점을 숙지한 뒤, 하단의 실전 게임으로 완벽하게 체화하세요!";

      // 카드 목록 갱신
      const grid = document.getElementById('study-card-grid');
      let html = '';
      data.cards.forEach(card => {
        html += `
          <div class="study-card">
            <div class="study-card-title">${card.title}</div>
            <ul class="study-card-list">
              ${card.items.map(it => `<li>${it}</li>`).join('')}
            </ul>
          </div>
        `;
      });
      grid.innerHTML = html;

      // 하단 액션 버튼 갱신
      const btnContainer = document.getElementById('bottom-play-buttons');
      if (data.playUrlB) {
        btnContainer.innerHTML = `
          <a href="${data.playUrl}" class="btn-play-action">
            <span>🎯 A 실전 요격형 ▶</span>
          </a>
          <a href="${data.playUrlB}" class="btn-play-action btn-b">
            <span>🛸 B 플로팅 헌터 ▶</span>
          </a>
        `;
      } else {
        btnContainer.innerHTML = `
          <a href="${data.playUrl}" class="btn-play-action" style="max-width:100%;">
            <span>🎮 [제 ${roundNum}탄] 실전 게임 도전하기 ▶</span>
          </a>
        `;
      }

      // 스크롤 맨 위로 부드럽게 이동
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 초기화
    document.addEventListener('DOMContentLoaded', () => {
      const initialRound = getRoundFromUrl();
      selectRound(initialRound);
    });
  </script>
