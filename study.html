<!DOCTYPE html>

<head>

      margin: 0;
      padding: 0;
    }
    body {

      background: #0d1117;
      color: #e6edf3;

      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 1. 상단 글로벌 헤더 */
    .app-header {
      background: rgba(22, 27, 34, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #30363d;
      position: sticky;
      top: 0;
      z-index: 200;
      height: 60px;
    }
    .header-inner {
      width: 100%;
      height: 100%;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    /* 모바일 전용 햄버거 메뉴 버튼 */
    .btn-sidebar-toggle {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #21262d;
      border: 1px solid #388bfd;
      color: #58a6ff;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-sidebar-toggle:hover {
      background: #388bfd;
      color: #ffffff;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }
    .brand-icon {
      font-size: 1.45rem;
    }
    .brand-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: #f0f6fc;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 0.72rem;
      color: #8b949e;
    }
    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-back-home:hover {
      background: #30363d;
      color: #58a6ff;
      border-color: #58a6ff;
    }

    /* 2. 메인 2단 레이아웃 (좌: 사이드바 / 우: 본문) */
    .app-layout {
      display: flex;
      flex: 1;
      width: 100%;
      min-height: calc(100vh - 60px);
    }

    /* 모바일 배경 딤 */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      z-index: 250;
    }

    /* 좌측 사이드바 (TOC 목차) */
    .study-sidebar {
      width: 290px;
      flex: 0 0 290px;
      background: #161b22;
      border-right: 1px solid #30363d;
      height: calc(100vh - 60px);
      position: sticky;
      top: 60px;
      overflow-y: auto;
      padding: 16px 12px 60px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
    }
    .study-sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .study-sidebar::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 10px;
      border-bottom: 1px solid #21262d;
    }
    .sidebar-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
    }
    .btn-sidebar-close {
      display: none;
      background: none;
      border: none;
      color: #8b949e;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .btn-sidebar-close:hover {
      color: #f0f6fc;
      background: #21262d;
    }

    /* 편(Part) 그룹 */
    .sidebar-part-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .part-header {
      font-size: 0.82rem;
      font-weight: 800;
      color: #58a6ff;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(56, 139, 253, 0.08);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .part-round-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-left: 6px;
    }
    .round-nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      color: #c9d1d9;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      width: 100%;
    }
    .round-nav-item:hover {
      background: #21262d;
      color: #ffffff;
    }
    .round-nav-item.active {
      background: #1f6feb;
      border-color: #388bfd;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(31, 111, 235, 0.4);
    }
    .round-nav-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      color: inherit;
      white-space: nowrap;
    }
    .round-nav-item.active .round-nav-badge {
      background: rgba(255, 255, 255, 0.25);
    }
    .round-nav-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 3. 우측 본문 영역 */
    .study-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .content-container {
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 140px;
    }

    /* 히어로 헤더 */
    .study-hero {
      background: linear-gradient(135deg, #1f242c 0%, #161b22 100%);
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .round-tag {
      display: inline-block;
      align-self: flex-start;
      padding: 4px 10px;
      background: rgba(56, 139, 253, 0.18);
      border: 1px solid rgba(56, 139, 253, 0.4);
      color: #58a6ff;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .study-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #f0f6fc;
      line-height: 1.35;
    }
    .study-desc {
      font-size: 0.9rem;
      color: #8b949e;
      line-height: 1.55;
    }

    /* 요약 카드 목록 */
    .study-card-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .study-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 18px 20px;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }
    .study-card:hover {
      border-color: #58a6ff;
      transform: translateY(-1px);
    }
    .study-card-title {
      font-size: 1.08rem;
      font-weight: 800;
      color: #58a6ff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #21262d;
      padding-bottom: 9px;
    }
    .study-card-list {
      list-style: none;
      font-size: 0.94rem;
      color: #c9d1d9;
      line-height: 1.8;
    }
    .study-card-list li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 8px;
    }
    .study-card-list li:last-child {
      margin-bottom: 0;
    }
    .study-card-list li::before {
      content: "•";
      position: absolute;
      left: 3px;
      color: #f78166;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .highlight-badge {
      font-weight: 700;
      color: #e3b341;
      background: rgba(227, 179, 65, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .highlight-red {
      font-weight: 700;
      color: #f85149;
      background: rgba(248, 81, 73, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* 4. 하단 고정 게임 시작 액션 바 (PC: 사이드바 우측 고정) */
    .bottom-action-bar {
      position: fixed;
      bottom: 0;
      left: 290px;
      right: 0;
      background: rgba(22, 27, 34, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid #30363d;
      padding: 12px 24px;
      z-index: 150;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.35);
    }
    .bottom-inner {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .bottom-label {
      font-size: 0.85rem;
      color: #8b949e;
      display: flex;
      flex-direction: column;
    }
    .bottom-label strong {
      color: #f0f6fc;
      font-size: 0.96rem;
    }
    .bottom-buttons {
      display: flex;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
      max-width: 460px;
    }
    .btn-play-action {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
      background: #238636;
      color: #ffffff;
      flex: 1;
      text-align: center;
    }
    .btn-play-action:hover {
      background: #2ea043;
      transform: translateY(-2px);
    }
    .btn-play-action.btn-b {
      background: #8957e5;
    }
    .btn-play-action.btn-b:hover {
      background: #a371f7;
    }

    /* 5. 반응형 미디어 쿼리 (태블릿 & 모바일) */
    @media (max-width: 900px) {
      .btn-sidebar-toggle {
        display: inline-flex;
      }
      .study-sidebar {
        position: fixed;
        top: 0;
        left: -310px;
        width: 300px;
        height: 100vh;
        z-index: 300;
        transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: none;
      }
      .study-sidebar.open {
        left: 0;
        box-shadow: 8px 0 28px rgba(0, 0, 0, 0.7);
      }
      .sidebar-backdrop.active {
        display: block;
      }
      .btn-sidebar-close {
        display: block;
      }
      .bottom-action-bar {
        left: 0;
      }
      .content-container {
        padding: 16px 14px 130px;
      }
    }

    @media (max-width: 600px) {
      .bottom-label {
        display: none;
      }
      .bottom-buttons {
        max-width: 100%;
        width: 100%;
      }
      .btn-play-action {
        padding: 10px;
        font-size: 0.85rem;
      }
      .study-title {
        font-size: 1.2rem;
      }
      .brand-sub {
        display: none;
      }
    }
  </style>
</head>

  <!-- 1. 헤더 -->
  <header class="app-header">

    for (const [legacy, modern] of Object.entries(LEGACY_MAP)) {
      if (STUDY_DATA[modern] && !STUDY_DATA[legacy]) {
        STUDY_DATA[legacy] = STUDY_DATA[modern];
      }
    }

    let currentRound = "1-1";

    // URL에서 라운드 추출 (레거시 파라미터 자동 변환)
    function getRoundFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const val = params.get('round');
      if (!val) return "1-1";
      if (STUDY_DATA[val]) {
        return LEGACY_MAP[val] || val;
      }
      return "1-1";
    }

    // 좌측 사이드바 목차 렌더링
    function renderSidebar() {
      const navContainer = document.getElementById('sidebar-nav');
      let html = '';

      CATEGORIES.forEach(cat => {
        html += `
          <div class="sidebar-part-group">
            <div class="part-header">
              <span>${cat.icon}</span>
              <span>${cat.name}</span>
            </div>
            <div class="part-round-list">
              ${cat.rounds.map(r => `
                <button class="round-nav-item ${r.id === currentRound ? 'active' : ''}" 
                        onclick="selectRound('${r.id}')">
                  <span class="round-nav-badge">${r.id}</span>
                  <span class="round-nav-label">${r.icon} ${r.label.split(' ')[1] || r.label}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      });

      navContainer.innerHTML = html;
    }

    // 라운드 선택 시 통합 처리
    function selectRound(roundId) {
      // 레거시 번호 대응
      currentRound = LEGACY_MAP[roundId] || roundId;

      // URL 파라미터 업데이트 (새로고침 없이)
      const url = new URL(window.location);
      url.searchParams.set('round', currentRound);
      window.history.replaceState({}, '', url);

      // 사이드바 활성 상태 갱신
      renderSidebar();

      // 모바일 드로어가 열려있다면 닫기
      closeSidebar();

      // 본문 데이터 갱신
      const data = STUDY_DATA[currentRound];
      if (!data) return;

      // 히어로 영역 갱신
      document.getElementById('hero-tag').textContent = `ROUND ${currentRound}`;
      document.getElementById('hero-title').textContent = data.title;
      document.getElementById('hero-desc').textContent = ROUND_DESCS[currentRound] || "핵심 암기 요점을 숙지한 뒤, 하단의 실전 게임으로 완벽하게 체화하세요!";

      // 카드 목록 갱신
      const grid = document.getElementById('study-card-grid');
      let html = '';
      data.cards.forEach(card => {
        html += `
          <div class="study-card">
            <div class="study-card-title">${card.title}</div>
            <ul class="study-card-list">
              ${card.items.map(it => `<li>${it}</li>`).join('')}
            </ul>
          </div>
        `;
      });
      grid.innerHTML = html;

      // 하단 액션 버튼 갱신
      const btnContainer = document.getElementById('bottom-play-buttons');
      if (data.playUrlB) {
        btnContainer.innerHTML = `
          <a href="${data.playUrl}" class="btn-play-action">
            <span>🎯 A 실전 요격형 ▶</span>
          </a>
          <a href="${data.playUrlB}" class="btn-play-action btn-b">
            <span>🛸 B 플로팅 헌터 ▶</span>
          </a>
        `;
      } else {
        btnContainer.innerHTML = `
          <a href="${data.playUrl}" class="btn-play-action" style="max-width:100%;">
            <span>🎮 [제 ${currentRound}탄] 실전 게임 도전하기 ▶</span>
          </a>
        `;
      }

      // 본문 맨 위로 스크롤
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 모바일 사이드바 열기/닫기 제어
    function toggleSidebar() {
      const sidebar = document.getElementById('study-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      sidebar.classList.toggle('open');
      backdrop.classList.toggle('active');
    }

    function closeSidebar() {
      const sidebar = document.getElementById('study-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (sidebar) sidebar.classList.remove('open');
      if (backdrop) backdrop.classList.remove('active');
    }

    // 초기화
    document.addEventListener('DOMContentLoaded', () => {
      const initialRound = getRoundFromUrl();
      currentRound = initialRound;
      renderSidebar();
      selectRound(initialRound);
    });
  </script>
