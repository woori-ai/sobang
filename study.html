                "• <b>제4류</b>: <span class='highlight-badge'>제2류, 제3류, 제5류</span>와 혼재 가능 (혼재 폭이 가장 넓음)",
                "• <b>제5류</b>: <span class='highlight-badge'>제2류, 제4류</span>와 혼재 가능",
                "• <b>제6류</b>: 오직 <span class='highlight-badge'>제1류</span>와만 혼재 가능",
                "<span class='highlight-red'>[절대 혼재 불가]</span>: 제1류와 제2·3·4·5류는 절대 혼재 불가!"
              ]
            },
            {
              title: "2. 제조소등 표지 및 방화 주의사항 게시판 (색상·문구)",
              items: [
                "<b>제조소등 표지</b>: <span class='highlight-badge'>백색 바탕 + 흑색 문자</span> (크기: 한 변 0.3m 이상, 다른 변 0.6m 이상 직사각형)",
                "<b>주의사항 게시판 3총사</b>:",
                "① <span class='highlight-badge'>물기엄금 (청색 바탕 + 백색 문자)</span>: 제1류 무기과산화물(알칼리금속과산화물), 제2류 철분·금속분·마그네슘, 제3류 금수성 물질",
                "② <span class='highlight-badge'>화기주의 (황색 바탕 + 백색 문자)</span>: 제2류 가연성 고체 (인화성 고체 제외)",
                "③ <span class='highlight-red'>화기엄금 (적색 바탕 + 백색 문자)</span>: 제2류 인화성 고체, 제3류 자연발화성 물질(황린 등), 제4류 인화성 액체, 제5류 자기반응성 물질"
              ]
            },
            {
              title: "3. 제조소의 안전거리 황금 수치 & 특수위험물 저장법",
              items: [
                "<b>제조소 외벽과 보호대상물 간 안전거리</b>:",
                "• <b>주거용 건축물</b>: <span class='highlight-badge'>10m 이상</span>",
                "• <b>고압가스, 도시가스 시설</b>: <span class='highlight-badge'>20m 이상</span>",
                "• <b>학교, 병원, 극장, 교회 등 다수인 수용시설</b>: <span class='highlight-badge'>30m 이상</span>",
                "• <b>유형문화재, 지정문화재</b>: <span class='highlight-red'>50m 이상</span> (가장 멂)",
                "• <b>고압가공전선</b>: 7,000V 이하 3m 이상 / 7,000~35,000V 이하 5m 이상",
                "<b>특수 위험물 보호액 및 저장 방법</b>:",
                "• <b>황린 (제3류)</b>: 공기 중 자연발화 방지를 위해 <span class='highlight-badge'>물속(pH 9)에 보관</span>",
                "• <b>칼륨·나트륨 (제3류)</b>: 공기·수분 접촉 차단을 위해 <span class='highlight-badge'>석유(등유, 경유, 유동파라핀) 속에 보관</span>",
                "• <b>이황화탄소 (제4류 특수인화물)</b>: 가연성 증기 발생 억제를 위해 <span class='highlight-badge'>물속(수조)에 보관</span>",
                "• <b>니트로셀룰로오스 (제5류)</b>: 알코올 또는 물에 습윤하여 냉암소 보관"
              ]
            },
            {
              title: "4. 위험물안전관리자 선임·해임·신고 일정 & 벌칙",
              items: [
                "<b>선임 기한</b>: 제조소등 완공검사필증 교부일 또는 해임·퇴직일로부터 <span class='highlight-badge'>30일 이내</span>",
                "<b>선임 신고</b>: 선임한 날부터 <span class='highlight-badge'>14일 이내</span>에 관할 <b>소방본부장 또는 소방서장</b>에게 신고",
                "<b>직무대리자 지정</b>: 안전관리자 퇴직·해임 후 대리자 직무 대행 기간 <span class='highlight-badge'>30일 이내</span>",
                "<b>법정 벌칙</b>:",
                "• 안전관리자를 선임하지 아니한 관계인: <span class='highlight-red'>1,500만원 이하의 벌금</span> (형벌 처벌)",
                "• 선임신고를 하지 않거나 거짓으로 신고한 자: <span class='highlight-badge'>과태료 500만원 이하</span>"
              ]
            }
          ]
        },
    };

    // ----------------------------------------------------
    // 과목(대분류) 및 라운드(소분류) 계층 데이터
    // ----------------------------------------------------
    const CATEGORIES = [
      {
        id: "part1",
        name: "제1편 소방안전관리",
        icon: "📘",
        rounds: [
          { id: 1, num: "1탄", label: "🎯 1탄 대상물 구분" },
          { id: 2, num: "2탄", label: "⏱️ 2탄 자격·경력" },
          { id: 3, num: "3탄", label: "📅 3탄 실무일정" }
        ]
      },
      {
        id: "part2",
        name: "제2편 법령·소방시설",
        icon: "⚖️",
        rounds: [
          { id: 4, num: "4탄", label: "🧯 4탄 5대분류" },
          { id: 5, num: "5탄", label: "⚖️ 5탄 벌칙과태료" }
        ]
      },
      {
        id: "part3",
        name: "제3편 건축관계법령",
        icon: "🏛️",
        rounds: [
          { id: 6, num: "6탄", label: "🏛️ 6탄 건축법령" }
        ]
      },
      {
        id: "part4",
        name: "제4편 소방학개론",
        icon: "🔥",
        rounds: [
          { id: "7-1", num: "7-1탄", label: "🔥 7-1탄 연소·위험물" },
          { id: "7-2", num: "7-2탄", label: "💥 7-2탄 화재·특수현상" },
          { id: "7-3", num: "7-3탄", label: "🧯 7-3탄 소화·약제" }
        ]
      },
      {
        id: "part5",
        name: "제5편 위험물·전기·가스",
        icon: "🛢️",
        rounds: [
          { id: "8-1", num: "8-1탄", label: "🛢️ 8-1탄 위험물 안전관리" },
          { id: "8-2", num: "8-2탄", label: "🛢️ 8-2탄 시설기준 & 혼재" }
        ]
      }
    ];

    const ROUND_DESCS = {
      1: "특급·1급·2급·3급 특정소방대상물의 층수, 높이, 연면적 및 수량 기준 완벽 대비",
      2: "소방공무원 경력연수(20/7/3/1) 및 기사·산업기사 실무경력 연수 완전 정복",
      3: "종합점검·작동점검 실시 시기, 보고서 제출 기한(10일/15일), 점검자 자격 완벽 정리",
      4: "소화설비, 경보설비, 피난구조설비, 소화용수설비, 소화활동설비 5대 소방시설 분류",
      5: "5년·5천부터 100만원 과태료까지! 1급 시험에만 출제되는 소방 벌칙·과태료 족집게",
      6: "주요구조부(바지보내기주), 비주요구조부, 용적률 산정 제외 4총사, 건축 5대 행위 완벽 마스터",
      7: "연소의 3/4요소, 인화점 서열, 가연성증기 연소범위, 제1~6류 위험물, 제4류 품명 완벽 정리",
      '7-1': "연소의 3/4요소, 인화점 서열, 가연성증기 연소범위, 제1~6류 위험물, 제4류 품명 완벽 정리",
      '7-2': "화재분류(A~K급), 롤오버·플래시오버·백드래프트·보일오버, 열전달 3방식, 연기 유동속도",
      '7-3': "4대 소화원리(냉각/질식/제거/억제), 분말소화약제 1~4종 성분·착색, 주수금지 물질 총정리",
      '8-1': "제4류 지정수량, 위험물 1~6류 성질·소화방법, 연료가스(LPG/LNG) 특성 및 가스경보기 설치기준",
      '8-2': "위험물 운반혼재(1-6, 2-4-5, 3-4, 5-2-4), 주의게시판 색상, 시설 안전거리, 안전관리자 선임기한(30일/14일)"
    };

    let currentRound = 1;
    let currentCatId = "part1";

    function getRoundFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const val = params.get('round');
      if (['7-1', '7-2', '7-3', '8-1', '8-2'].includes(val)) return val;
      const r = parseInt(val, 10);
      if (r >= 1 && r <= 7) return r;
      return 1;
    }

    // 주어진 roundId가 속한 카테고리 찾기
    function findCategoryByRound(roundId) {
      for (const cat of CATEGORIES) {
        if (cat.rounds.some(r => String(r.id) === String(roundId))) {
          return cat;
        }
      }
      return CATEGORIES[0];
    }

    // 1단 과목 탭 렌더링
    function renderCategoryTabs() {
      const catContainer = document.getElementById('cat-tabs');
      catContainer.innerHTML = CATEGORIES.map(cat => `
        <button class="cat-tab-btn ${cat.id === currentCatId ? 'active' : ''}" 
                onclick="selectCategory('${cat.id}')">
          <span>${cat.icon}</span> <span>${cat.name}</span>
        </button>
      `).join('');
    }

    // 2단 소분류 라운드 칩 렌더링
    function renderSubRoundTabs() {
      const subContainer = document.getElementById('sub-round-tabs');
      const cat = CATEGORIES.find(c => c.id === currentCatId) || CATEGORIES[0];
      subContainer.innerHTML = cat.rounds.map(r => `
        <button class="sub-round-btn ${String(r.id) === String(currentRound) ? 'active' : ''}" 
                onclick="selectRound('${r.id}')">
          ${r.label}
        </button>
      `).join('');
    }

    // 모바일 드롭다운 렌더링
    function renderMobileSelect() {
      const select = document.getElementById('mobile-round-select');
      select.innerHTML = CATEGORIES.map(cat => `
        <optgroup label="${cat.icon} ${cat.name}">
          ${cat.rounds.map(r => `
            <option value="${r.id}" ${String(r.id) === String(currentRound) ? 'selected' : ''}>
              ${r.label}
            </option>
          `).join('')}
        </optgroup>
      `).join('');
    }

    // 1단 과목 탭 클릭 시
    function selectCategory(catId) {
      currentCatId = catId;
      const cat = CATEGORIES.find(c => c.id === catId);
      if (cat && cat.rounds.length > 0) {
        // 해당 과목의 첫 번째 라운드로 이동
        selectRound(cat.rounds[0].id);
      }
    }

    // 라운드 선택 시 통합 처리
    function selectRound(roundNum) {
      currentRound = roundNum;

      // 해당 라운드의 과목 찾기
      const cat = findCategoryByRound(roundNum);
      currentCatId = cat.id;

      // URL 파라미터 업데이트 (새로고침 없이)
      const url = new URL(window.location);
      url.searchParams.set('round', roundNum);
      window.history.replaceState({}, '', url);

      // PC 1단 & 2단 탭 갱신
      renderCategoryTabs();
      renderSubRoundTabs();

      // 모바일 드롭다운 갱신
      const mobileSelect = document.getElementById('mobile-round-select');
      if (mobileSelect) {
        mobileSelect.value = String(roundNum);
      }

      // 본문 데이터 갱신
      const data = STUDY_DATA[roundNum];
      if (!data) return;

      // 히어로 영역 갱신
      document.getElementById('hero-tag').textContent = typeof roundNum === 'string' && roundNum.startsWith('7-') ? `ROUND ${roundNum}` : `ROUND 0${roundNum}`;
      document.getElementById('hero-title').textContent = data.title;
      document.getElementById('hero-desc').textContent = ROUND_DESCS[roundNum] || "핵심 암기 요점을 숙지한 뒤, 하단의 실전 게임으로 완벽하게 체화하세요!";

      // 카드 목록 갱신
      const grid = document.getElementById('study-card-grid');
      let html = '';
      data.cards.forEach(card => {
        html += `
          <div class="study-card">
            <div class="study-card-title">${card.title}</div>
            <ul class="study-card-list">
              ${card.items.map(it => `<li>${it}</li>`).join('')}
            </ul>
          </div>
        `;
      });
      grid.innerHTML = html;

      // 하단 액션 버튼 갱신
      const btnContainer = document.getElementById('bottom-play-buttons');
      if (data.playUrlB) {
        btnContainer.innerHTML = `
          <a href="${data.playUrl}" class="btn-play-action">
            <span>🎯 A 실전 요격형 ▶</span>
          </a>
          <a href="${data.playUrlB}" class="btn-play-action btn-b">
            <span>🛸 B 플로팅 헌터 ▶</span>
          </a>
        `;
      } else {
        btnContainer.innerHTML = `
          <a href="${data.playUrl}" class="btn-play-action" style="max-width:100%;">
            <span>🎮 [제 ${roundNum}탄] 실전 게임 도전하기 ▶</span>
          </a>
        `;
      }

      // 스크롤 맨 위로 부드럽게 이동
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 초기화
    document.addEventListener('DOMContentLoaded', () => {
      const initialRound = getRoundFromUrl();
      const cat = findCategoryByRound(initialRound);
      currentCatId = cat.id;

      renderCategoryTabs();
      renderSubRoundTabs();
      renderMobileSelect();

      selectRound(initialRound);
    });
  </script>
</body>
</html>
